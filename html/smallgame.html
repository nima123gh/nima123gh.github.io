<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nima's Adventure - Full Restoration</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: #000; 
            display: flex; flex-direction: column; 
            height: 100vh; overflow: hidden; 
            font-family: sans-serif; touch-action: none;
        }
        #game-container { flex: 1; width: 100%; display: flex; justify-content: center; align-items: center; }
        
        #mobile-controls {
            display: flex; height: 180px; width: 100%;
            background: #111; border-top: 2px solid #333;
            padding: 10px; justify-content: space-between; align-items: center;
        }

        .dpad {
            display: grid;
            grid-template-areas: ". up ." "left . right" ". down .";
            gap: 5px;
        }
        .btn {
            width: 60px; height: 60px; background: #333; color: white;
            border: 1px solid #555; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 24px; user-select: none;
        }
        .btn:active { background: #666; }
        .up { grid-area: up; } .down { grid-area: down; }
        .left { grid-area: left; } .right { grid-area: right; }

        #interact-btn {
            width: 110px; height: 110px; 
            background: #e67e22; color: white;
            border: 4px solid #ff9f43; border-radius: 50%;
            font-size: 18px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            margin-right: 15px; box-shadow: 0 4px 0 #a0522d;
        }
        #interact-btn:active { transform: translateY(4px); box-shadow: none; background: #d35400; }
    </style>
</head>
<body>

<div id="game-container"></div>

<div id="mobile-controls">
    <div class="dpad">
        <div class="btn up" id="btn-up">▲</div>
        <div class="btn left" id="btn-left">◀</div>
        <div class="btn right" id="btn-right">▶</div>
        <div class="btn down" id="btn-down">▼</div>
    </div>
    
    <button id="interact-btn">ACTION</button>
</div>

<script>
window.gameState = { coins: 0, inventory: [] };
let btnState = { up: false, down: false, left: false, right: false };
let activeScene = null;

const setupBtn = (id, key) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { 
        e.preventDefault(); 
        btnState[key] = true; 
        if(activeScene && activeScene.handleNav) activeScene.handleNav(key);
    });
    el.addEventListener('touchend', (e) => { e.preventDefault(); btnState[key] = false; });
};
setupBtn('btn-up', 'up'); setupBtn('btn-down', 'down');
setupBtn('btn-left', 'left'); setupBtn('btn-right', 'right');

document.getElementById('interact-btn').addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (activeScene && typeof activeScene.handleAction === 'function') activeScene.handleAction();
});

function handleMovement(scene, player, speed) {
    if (!player.body || !player.body.enable) return;
    player.setVelocity(0);
    let vx = 0; let vy = 0;
    if (btnState.left) vx = -1; else if (btnState.right) vx = 1;
    if (btnState.up) vy = -1; else if (btnState.down) vy = 1;
    if (vx !== 0 || vy !== 0) player.setVelocity(vx * speed, vy * speed);
}

// --- 1. TOWN SCENE ---
class TownScene extends Phaser.Scene {
    constructor() { super('TownScene'); }
    preload() {
        this.load.image('hero_img', '/images/nima.png');
        this.load.image('gf_img', '/images/asal.png');
        this.load.image('town_bg', '/images/background2.png'); 
    }
    create() {
        activeScene = this;
        this.add.image(400, 300, 'town_bg').setDisplaySize(800, 600);
        this.player = this.physics.add.sprite(150, 500, 'hero_img').setScale(0.12).setOrigin(0.5, 1);
        this.gf = this.physics.add.staticSprite(650, 500, 'gf_img').setScale(0.20).setOrigin(0.5, 1);
        this.isDialogueOpen = false;
        this.dialogueIndex = 0;
        this.dialogueLines = [
            "عسل : سلام نیمای خوشگلممممم چطوری شوشوعکم",
            "نیما : فداتشم من دختر نازم .امروز یه برنامه خفن دارم واست",
            "عسل : چیییی بابا؟؟؟؟؟؟؟؟؟؟؟؟؟؟",
            "نیما : میخوام با هم بریم جنگل کلی گل جمع کنیییممممم",
            "عسل : هوراااااااا! بریممممممممممم"
        ];
        this.physics.add.overlap(this.player, this.gf, () => this.startDialogue());
    }
    startDialogue() {
        if (this.isDialogueOpen) return;
        this.isDialogueOpen = true;
        this.player.setVelocity(0);
        this.dialogueBox = this.add.container(0,0).setDepth(100);
        let rect = this.add.graphics().fillStyle(0x000088, 0.9).fillRoundedRect(100, 450, 600, 120, 10).lineStyle(3, 0xffffff).strokeRoundedRect(100, 450, 600, 120, 10);
        this.displayText = this.add.text(130, 475, this.dialogueLines[0], { fontSize: '20px', fill: '#fff', wordWrap: { width: 540 } });
        this.dialogueBox.add([rect, this.displayText]);
    }
    handleAction() {
        if (this.isDialogueOpen) {
            this.dialogueIndex++;
            if (this.dialogueIndex < this.dialogueLines.length) this.displayText.setText(this.dialogueLines[this.dialogueIndex]);
            else this.scene.start('JungleScene');
        }
    }
    update() { if (!this.isDialogueOpen) handleMovement(this, this.player, 250); }
}

// --- 2. JUNGLE SCENE (ASAL FOLLOWS) ---
class JungleScene extends Phaser.Scene {
    constructor() { super('JungleScene'); }
    preload() {
        this.load.image('jungle_tile', '/images/jungle.png');
        this.load.image('hero_img', '/images/nima.png');
        this.load.image('gf_img', '/images/asal.png');
        this.load.image('gold', '/images/coin.png');
        this.load.image('sana', '/images/sana.png');
        this.load.image('sanaevo', '/images/sanaevo.png');
    }
    create() {
        activeScene = this;
        this.physics.world.setBounds(0, 0, 1600, 1200);
        this.add.tileSprite(800, 600, 1600, 1200, 'jungle_tile');
        this.player = this.physics.add.sprite(100, 100, 'hero_img').setScale(0.12).setCollideWorldBounds(true);
        this.gf = this.add.sprite(80, 100, 'gf_img').setScale(0.21);
        this.history = [];
        this.cameras.main.setBounds(0, 0, 1600, 1200).startFollow(this.player);
        this.scoreText = this.add.text(20, 20, 'گل ها: ' + window.gameState.coins, { fontSize: '24px', fill: '#ffd700' }).setScrollFactor(0);
        
        this.loot = this.physics.add.group();
        for(let i=0; i<15; i++) this.loot.create(Phaser.Math.Between(300, 1500), Phaser.Math.Between(200, 1000), 'gold').setScale(0.2);
        
        this.stranger = this.physics.add.sprite(1400, 1000, 'sana').setScale(0.2);
        this.physics.add.overlap(this.player, this.loot, (p, item) => { 
            item.destroy(); window.gameState.coins++; this.scoreText.setText('گل ها: ' + window.gameState.coins); 
        });
        this.physics.add.overlap(this.player, this.stranger, () => this.scene.start('BattleScene'));
    }
    update() { 
        handleMovement(this, this.player, 300);
        this.history.push({x: this.player.x, y: this.player.y});
        if (this.history.length > 15) { let pos = this.history.shift(); this.gf.x = pos.x-40; this.gf.y = pos.y; }
    }
}

// --- 3. BATTLE SCENE (RESTORED ELEMENTS) ---
class BattleScene extends Phaser.Scene {
    constructor() { super('BattleScene'); }
    preload() {
        this.load.image('battle_bg', '/images/background1.png'); 
        this.load.image('hero_img', '/images/nima.png');
        this.load.image('monster_img', '/images/sanaevo.png');
    }
    create() {
        activeScene = this;
        this.add.image(400, 300, 'battle_bg').setDisplaySize(800, 600);
        this.heroHP = 100; this.monsterHP = 150; this.selectedOption = 0; this.isTurn = true;
        
        this.hero = this.add.image(200, 420, 'hero_img').setScale(0.12).setOrigin(0.5, 1);
        this.monster = this.add.image(600, 420, 'monster_img').setScale(0.25).setOrigin(0.5, 1).setFlipX(true);
        
        this.hpText = this.add.text(100, 435, `جون نیما: ${this.heroHP}`, { fontSize: '20px', color: '#0f0', stroke: '#000', strokeThickness: 2 });
        this.mHpText = this.add.text(500, 435, `جون ثنا: ${this.monsterHP}`, { fontSize: '20px', color: '#f00', stroke: '#000', strokeThickness: 2 });
        this.statusText = this.add.text(400, 100, "نوبت نیما", { fontSize: '28px', color: '#fff' }).setOrigin(0.5);
        
        this.menuUI = this.add.container(400, 520);
        this.updateUI();
    }
    handleNav(dir) {
        if (!this.isTurn) return;
        if (dir === 'left') this.selectedOption = 0;
        if (dir === 'right') this.selectedOption = 1;
        this.updateUI();
    }
    updateUI() {
        this.menuUI.removeAll(true);
        let atk = this.add.text(-100, 0, "[ حمله ]", { backgroundColor: this.selectedOption === 0 ? '#e67e22' : '#333', padding: 10 }).setOrigin(0.5);
        let def = this.add.text(100, 0, "[ دفاع ]", { backgroundColor: this.selectedOption === 1 ? '#e67e22' : '#333', padding: 10 }).setOrigin(0.5);
        this.menuUI.add([atk, def]);
    }
    handleAction() {
        if (!this.isTurn) return;
        this.isTurn = false;
        if (this.selectedOption === 0) {
            this.tweens.add({ targets: this.hero, x: 450, duration: 100, yoyo: true, onComplete: () => {
                this.monsterHP -= 50; this.mHpText.setText(`جون ثنا: ${this.monsterHP}`);
                if(this.monsterHP <= 0) this.scene.start('CityScene');
                else this.time.delayedCall(800, () => this.monsterTurn());
            }});
        } else {
            this.statusText.setText("نیما دفاع کرد!");
            this.time.delayedCall(1000, () => this.monsterTurn(true));
        }
    }
    monsterTurn(heroDefending = false) {
        this.statusText.setText("نوبت ثنا...");
        this.tweens.add({ targets: this.monster, x: 350, duration: 150, yoyo: true, onComplete: () => {
            let dmg = heroDefending ? 5 : 20;
            this.heroHP -= dmg; this.hpText.setText(`جون نیما: ${this.heroHP}`);
            if(this.heroHP <= 0) this.scene.start('TownScene');
            else { this.isTurn = true; this.statusText.setText("نوبت نیما"); }
        }});
    }
}

// --- 4. CITY SCENE (ASAL FOLLOWS) ---
class CityScene extends Phaser.Scene {
    constructor() { super('CityScene'); }
    preload() {
        this.load.image('city_bg', '/images/background2.png');
        this.load.image('npc_img', '/images/asal.png'); 
        this.load.image('pic1', '/images/item1.jpg'); 
        this.load.image('pic2', '/images/item2.jpg');
    }
    create() {
        activeScene = this;
        this.physics.world.setBounds(0, 0, 2400, 600);
        this.add.tileSprite(1200, 300, 2400, 600, 'city_bg');
        this.player = this.physics.add.sprite(200, 500, 'hero_img').setScale(0.12).setCollideWorldBounds(true);
        this.gf = this.add.sprite(160, 500, 'gf_img').setScale(0.21);
        this.history = [];
        this.cameras.main.setBounds(0, 0, 2400, 600).startFollow(this.player);
        this.shopOwner = this.physics.add.staticSprite(1200, 500, 'npc_img').setScale(0.15).setAlpha(0.7);
        
        this.coinText = this.add.text(20, 20, "گل ها: " + window.gameState.coins, { fontSize: '24px', fill: '#ffd700' }).setScrollFactor(0);
        this.shopMenu = this.add.container(400, 300).setDepth(2000).setScrollFactor(0).setVisible(false);
        this.viewerUI = this.add.container(400, 300).setDepth(3000).setScrollFactor(0).setVisible(false);
        this.shopOpen = false; this.viewing = false; this.shopIdx = 0;
        this.items = [{ id: 'pic1', name: 'خاطره اول', price: 2 }, { id: 'pic2', name: 'خاطره دوم', price: 4 }, { id: 'exit', name: 'خروج', price: 0 }];
    }
    handleNav(dir) {
        if (!this.shopOpen) return;
        if (dir === 'up') this.shopIdx = (this.shopIdx > 0) ? this.shopIdx - 1 : this.items.length - 1;
        if (dir === 'down') this.shopIdx = (this.shopIdx < this.items.length - 1) ? this.shopIdx + 1 : 0;
        this.updateShopUI();
    }
    update() {
        if (!this.shopOpen && !this.viewing) {
            handleMovement(this, this.player, 300);
            this.history.push({x: this.player.x, y: this.player.y});
            if (this.history.length > 15) { let pos = this.history.shift(); this.gf.x = pos.x-40; this.gf.y = pos.y; }
        }
        this.isNear = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.shopOwner.x, this.shopOwner.y) < 150;
    }
    handleAction() {
        if (this.viewing) { this.viewerUI.setVisible(false); this.viewing = false; this.shopOpen = true; this.updateShopUI(); return; }
        if (this.shopOpen) {
            let itm = this.items[this.shopIdx];
            if (itm.id === 'exit') { this.shopOpen = false; this.shopMenu.setVisible(false); }
            else if (window.gameState.inventory.includes(itm.id)) { this.showPhoto(itm.id); }
            else if (window.gameState.coins >= itm.price) {
                window.gameState.coins -= itm.price; window.gameState.inventory.push(itm.id);
                this.coinText.setText("گل ها: " + window.gameState.coins); this.updateShopUI();
            }
        } else if (this.isNear) { this.shopOpen = true; this.updateShopUI(); }
    }
    updateShopUI() {
        this.shopMenu.removeAll(true).setVisible(true);
        this.shopMenu.add(this.add.rectangle(0,0,500,400,0x000,0.9).setStrokeStyle(2,0xfff));
        this.items.forEach((it, i) => {
            let label = it.id === 'exit' ? it.name : `${it.name} ${window.gameState.inventory.includes(it.id) ? '[داری]' : `[${it.price}]`}`;
            this.shopMenu.add(this.add.text(-200, -100+(i*80), (i===this.shopIdx ? "> " : "  ")+label, {fill: i===this.shopIdx ? "#e67e22" : "#fff", fontSize:'22px'}));
        });
    }
    showPhoto(k) { this.shopOpen = false; this.shopMenu.setVisible(false); this.viewing = true; this.viewerUI.removeAll(true).setVisible(true); this.viewerUI.add([this.add.rectangle(0,0,800,600,0x000), this.add.image(0,0,k).setDisplaySize(700,500)]); }
}

const config = {
    type: Phaser.AUTO, parent: 'game-container',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: 800, height: 600 },
    physics: { default: 'arcade', arcade: { gravity: { y: 0 } } },
    scene: [TownScene, JungleScene, BattleScene, CityScene]
};
new Phaser.Game(config);
</script>
</body>
</html>
