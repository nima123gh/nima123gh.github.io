<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مراقبت روزانه ❤️</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<style>
  :root {
    --bg1: #ffe0ec; --bg2: #e3f2ff; --bg3: #fff6d9;
    --card: rgba(255,255,255,.75);
    --accent: #ff6b9d; --accent-dark: #e0446f;
    --text: #5a4452; --muted: #b39aa7; --done: #3ddc84;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Vazirmatn', sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; color: var(--text); overflow-x: hidden; perspective: 1200px;
  }
  .blob { position: fixed; border-radius: 50%; filter: blur(60px); opacity: .5; pointer-events: none; z-index: 0; animation: float 12s ease-in-out infinite; }
  .blob.b1 { width: 280px; height: 280px; background: #ffb3cd; top: -60px; right: -60px; }
  .blob.b2 { width: 240px; height: 240px; background: #a8d8ff; bottom: -40px; left: -40px; animation-delay: -4s; }
  .blob.b3 { width: 180px; height: 180px; background: #ffe9a8; top: 45%; left: 20%; animation-delay: -8s; }
  @keyframes float { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-30px) scale(1.08)} }

  .app {
    width: 100%; max-width: 460px; position: relative; z-index: 1;
    background: var(--card); backdrop-filter: blur(20px);
    border-radius: 34px; border: 1px solid rgba(255,255,255,.8);
    box-shadow: 0 25px 70px rgba(224,68,111,.22), inset 0 1px 0 #fff;
    overflow: hidden; transform-style: preserve-3d; transition: transform .15s ease-out;
  }
  .header {
    background: linear-gradient(135deg, #ff8fb3, #ff6b9d 60%, #f95c8e);
    padding: 26px 24px 18px; text-align: center; color: #fff; position: relative;
  }
  .header::after {
    content: ""; position: absolute; bottom: -1px; left: 0; right: 0; height: 26px;
    background: radial-gradient(circle at 12px -8px, transparent 16px, var(--card) 17px);
    background-size: 24px 26px;
  }
  .header h1 { font-size: 1.45rem; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .header p { opacity: .92; font-size: .88rem; margin-top: 4px; }
  #heartCanvas { width: 230px; height: 190px; margin: -6px auto -10px; display: block; cursor: grab; touch-action: none; }
  #heartCanvas:active { cursor: grabbing; }
  .drag-hint { font-size: .72rem; opacity: .85; margin-top: -6px; }

  .date-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .date-nav button {
    background: rgba(255,255,255,.28); border: none; color: #fff;
    width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; cursor: pointer;
    transition: all .2s; box-shadow: 0 4px 10px rgba(0,0,0,.12);
  }
  .date-nav button:hover:not(:disabled) { background: rgba(255,255,255,.45); transform: translateY(-2px); }
  .date-nav button:disabled { opacity: .35; cursor: default; }
  .date-nav button:focus-visible, .task:focus-visible, .water-minus:focus-visible {
    outline: 3px solid #fff; outline-offset: 2px;
  }
  #currentDate { font-weight: 700; font-size: .95rem; }

  .progress-wrap { display: flex; align-items: center; gap: 18px; padding: 22px 26px 4px; }
  .ring-box { width: 108px; height: 108px; position: relative; flex-shrink: 0; transform: rotateX(18deg); transform-style: preserve-3d; }
  .ring-box svg { transform: rotate(-90deg); }
  .ring-bg { stroke: #f3e4ec; }
  .ring-fill { stroke: url(#gradRing); stroke-linecap: round; transition: stroke-dashoffset .7s cubic-bezier(.34,1.4,.64,1); filter: drop-shadow(0 0 6px rgba(61,220,132,.6)); }
  .ring-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotateX(-18deg); }
  .ring-text b { font-size: 1.25rem; color: var(--accent-dark); }
  .ring-text small { font-size: .68rem; color: var(--muted); }
  .progress-side { flex: 1; }
  .progress-label { font-size: .92rem; font-weight: 600; line-height: 1.7; }
  .celebrate { display: none; margin-top: 8px; font-size: .92rem; font-weight: 700; color: #e0446f; }
  .celebrate.show { display: block; animation: pop .6s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 0%{transform:scale(.3);opacity:0} 100%{transform:scale(1);opacity:1} }

  .tasks { list-style: none; padding: 14px 20px 10px; }
  .task {
    display: flex; flex-direction: column; gap: 10px;
    padding: 15px 16px; margin-bottom: 14px; background: #fff;
    border-radius: 22px; border: 2px solid #fdeef4; cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease, border-color .25s;
    box-shadow: 0 6px 18px rgba(224,68,111,.08);
    user-select: none; transform-style: preserve-3d;
  }
  .task:hover { transform: translateY(-3px); box-shadow: 0 14px 28px rgba(224,68,111,.18); border-color: #ffc4d8; }
  .task:active { transform: translateY(0) scale(.99); }
  .task .row { display: flex; align-items: center; gap: 14px; }
  .task .icon {
    font-size: 1.7rem; width: 52px; height: 52px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg, #fff0f6, #ffe0ec); border-radius: 18px;
    box-shadow: 4px 4px 10px rgba(224,68,111,.12), -4px -4px 10px #fff; transition: all .3s;
  }
  .task .info { flex: 1; }
  .task .title { font-weight: 800; font-size: .98rem; }
  .task .desc { font-size: .8rem; color: var(--muted); margin-top: 3px; }
  .task .checkbox {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    border: 2.5px solid #eccddb; display: flex; align-items: center; justify-content: center;
    font-size: 0; color: #fff; transition: all .3s; box-shadow: inset 2px 2px 5px rgba(0,0,0,.06);
  }
  .task.done { background: linear-gradient(145deg, #f0fff6, #e2fbee); border-color: #b8f0d2; }
  .task.done .title { color: #1faa62; }
  .task.done .checkbox {
    background: linear-gradient(145deg, #4ce69a, #2ecc71); border-color: transparent;
    font-size: 16px; box-shadow: 0 4px 10px rgba(46,204,113,.45);
    animation: checkpop .4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes checkpop { 0%{transform:scale(.4)} 100%{transform:scale(1)} }
  .task.done .icon { background: linear-gradient(145deg, #e6f9ee, #d3f5e2); box-shadow: none; }

  /* 3D water glass */
  #waterCanvas { width: 100%; height: 170px; display: block; cursor: pointer; touch-action: manipulation; }
  .water-controls { display: flex; align-items: center; justify-content: space-between; padding: 0 6px; }
  .water-count-label { font-size: .88rem; font-weight: 700; color: #3a9bdc; }
  .water-minus {
    background: #fff0f6; border: 2px solid #ffd3e2; color: var(--accent-dark);
    font-family: inherit; font-weight: 700; font-size: .8rem;
    padding: 5px 14px; border-radius: 99px; cursor: pointer; transition: all .2s;
  }
  .water-minus:hover { background: #ffe0ec; transform: translateY(-1px); }
  .water-hint { font-size: .72rem; color: var(--muted); text-align: center; margin-top: 2px; }

  .note-area { padding: 6px 20px 8px; }
  .note-area textarea {
    width: 100%; border: 2px dashed #f3d3e0; border-radius: 20px;
    padding: 14px; font-family: inherit; font-size: .9rem;
    resize: vertical; min-height: 74px; color: var(--text);
    background: rgba(255,255,255,.7); transition: border-color .2s;
  }
  .note-area textarea:focus { outline: none; border-color: var(--accent); border-style: solid; }
  .status { text-align: center; font-size: .8rem; color: var(--muted); padding-bottom: 6px; }
  .footer { text-align: center; padding: 0 20px 24px; font-size: .82rem; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
    .app { transition: none; }
  }
  /* ===== سکه / فروشگاه / نامه‌ها ===== */
.eco-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px 20px 0}
.eco-pill{background:#fff;border:2px solid #fdeef4;border-radius:99px;padding:6px 14px;font-weight:800;font-size:.85rem;box-shadow:0 4px 12px rgba(224,68,111,.08)}
.eco-pill.bump{animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.eco-btn{font-family:inherit;position:relative;cursor:pointer;border:none;border-radius:99px;padding:8px 16px;font-weight:800;font-size:.85rem;color:#fff;background:linear-gradient(135deg,#ff8fb3,#ff6b9d);box-shadow:0 6px 14px rgba(224,68,111,.3);transition:transform .2s}
.eco-btn:hover{transform:translateY(-2px)}
.eco-dot{position:absolute;top:-3px;left:-3px;width:13px;height:13px;border-radius:50%;background:#3ddc84;border:2px solid #fff;display:none}
.modal-back{position:fixed;inset:0;background:rgba(90,68,82,.45);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-back.show{display:flex}
.modal{background:#fff;width:100%;max-width:440px;max-height:85vh;overflow:auto;border-radius:28px;padding:20px;box-shadow:0 25px 70px rgba(224,68,111,.3);animation:pop .35s cubic-bezier(.34,1.56,.64,1);color:var(--text)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-head h2{font-size:1.1rem;font-weight:800}
.modal-x{border:none;background:#fff0f6;color:var(--accent-dark);width:34px;height:34px;border-radius:50%;font-size:1rem;cursor:pointer}
.shop-balance{background:linear-gradient(135deg,#fff6d9,#ffe9a8);border-radius:16px;padding:10px;text-align:center;font-weight:800;margin-bottom:8px}
.shop-slot{font-size:.8rem;font-weight:800;color:var(--muted);margin:14px 4px 6px}
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.shop-item{background:#fff8fb;border:2px solid #fdeef4;border-radius:20px;padding:12px 8px;text-align:center}
.shop-item.on{border-color:#3ddc84;background:#f0fff6}
.si-icon{font-size:2rem}
.si-name{font-size:.82rem;font-weight:700;margin:4px 0 8px}
.si-btn{font-family:inherit;font-weight:700;font-size:.78rem;border:none;border-radius:99px;padding:6px 12px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#ff8fb3,#ff6b9d)}
.si-btn:disabled{background:#e6d6de;cursor:not-allowed}
.si-btn.own{background:linear-gradient(135deg,#4ce69a,#2ecc71)}
.letter{border:2px solid #fdeef4;border-radius:20px;padding:14px;margin-bottom:10px;background:#fff8fb}
.letter.open{cursor:pointer;background:#fffdf3;border-color:#ffe9a8}
.letter-title{font-weight:800;font-size:.95rem}
.letter-sub{font-size:.78rem;color:var(--muted);margin-top:4px}
.letter-bar{height:8px;background:#f3e4ec;border-radius:99px;margin-top:8px;overflow:hidden}
.letter-bar i{display:block;height:100%;background:linear-gradient(90deg,#ff8fb3,#ff6b9d)}
.letter-text{display:none;margin-top:10px;font-size:.9rem;line-height:2;white-space:pre-wrap}
.letter.expanded .letter-text{display:block}
.eco-toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(30px);background:#5a4452;color:#fff;padding:10px 20px;border-radius:99px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:all .35s;z-index:60}
.eco-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div class="app" id="app">
  <div class="header">
    <canvas id="heartCanvas" role="img" aria-label="قلب سه‌بعدی در حال تپش"></canvas>
    <div class="drag-hint">🖐️ قلب رو بگیر و بچرخونش!</div>
    <h1>مراقبت روزانه</h1>
    <div class="date-nav">
      <button id="prevDay" aria-label="روز قبل">‹</button>
      <span id="currentDate"></span>
      <button id="nextDay" aria-label="روز بعد">›</button>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="ring-box">
      <svg width="108" height="108" viewBox="0 0 108 108">
        <defs>
          <linearGradient id="gradRing" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4ce69a"/><stop offset="100%" stop-color="#27ae60"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="54" cy="54" r="46" fill="none" stroke-width="11"/>
        <circle class="ring-fill" id="ringFill" cx="54" cy="54" r="46" fill="none" stroke-width="11"
          stroke-dasharray="289" stroke-dashoffset="289"/>
      </svg>
      <div class="ring-text"><b id="ringPct">۰٪</b><small>تکمیل شد</small></div>
    </div>
    <div class="progress-side">
      <div class="progress-label" id="progressLabel"></div>
      <div class="celebrate" id="celebrate">🎉 آفرین دخترم! همه رو انجام دادی!🫠 بهت کلی جایزه میدم🤫❤️</div>
    </div>
  </div>

  <ul class="tasks" id="taskList"></ul>

  <div class="note-area">
    <label for="dailyNote" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">یادداشت روزانه</label>
    <textarea id="dailyNote" placeholder="حالتو امروز برام تعریف کن که بدونم قلب کوچولوت خوب بوده یا نه😘🥰🫀"></textarea>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
</div>

<script type="module">
  // ================== FIREBASE CONFIG ==================
  const firebaseConfig = {
    apiKey: "AIzaSyBs-MuaHUlewRYBdWz3WpP0q9Wbk7lL5sQ",
    authDomain: "daily-checklist-341a1.firebaseapp.com",
    projectId: "daily-checklist-341a1",
    storageBucket: "daily-checklist-341a1.firebasestorage.app",
    messagingSenderId: "335557202797",
    appId: "1:335557202797:web:023a442f5706dab0370064"
  };
  // ======================================================

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import * as THREE from "three";

  const TASKS = [
    { id: "exercise", icon: "🏃‍♀️", title: "ورزش", desc: "بدن کوچولوتو تکون بده 🫠 کلی کمکت میکنم و باهات تمرین میکنم هرروز فقط بهم قول بده که زودتر خوب میشی😘💓", type: "check" },
    { id: "water", icon: "💧", title: "نوشیدن ۱۲ لیوان آب", desc: "روی لیوان کلیک کن تا پر شه!", type: "water", goal: 12 },
    { id: "salt", icon: "🧂", title: "غذای پرنمک", desc: " توی همه‌ی غذاهات نمک بیشتر بریز فرشته کوچولوم💕", type: "check" },
    { id: "vitamind", icon: "💊", title: "قرص ویتامین D", desc: "همراه غذا بخور — یادت نره! خیلی دوست دارما بلوبریه بابا🫠💗🌌", type: "check" }
  ];

  const fa = n => String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);

  let db = null, firebaseReady = false;
  try {
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    firebaseReady = firebaseConfig.apiKey !== "YOUR_API_KEY";
  } catch (e) {}

  const state = {};
  let viewing = new Date();
  let allDonePrev = false;

  function dateKey(d) {
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function defaultState() {
    const s = { note: "" };
    TASKS.forEach(t => s[t.id] = t.type === "water" ? 0 : false);
    return s;
  }
  function loadLocal(k) {
    const raw = localStorage.getItem("carechecklist_" + k);
    return raw ? JSON.parse(raw) : null;
  }
  function saveLocalOnly() {
    const k = dateKey(viewing);
    localStorage.setItem("carechecklist_" + k, JSON.stringify(state[k]));
  }
  function save() {
    saveLocalOnly();
    const k = dateKey(viewing);
    if (firebaseReady) setDoc(doc(db, "checklists", k), state[k]).catch(()=>{});
    document.getElementById("status").textContent = firebaseReady ? "☁️ ذخیره شد" : "💾 روی همین دستگاه ذخیره شد";
  }

  let unsub = null;
  function load() {
    const k = dateKey(viewing);
    if (unsub) { unsub(); unsub = null; }
    state[k] = loadLocal(k) || defaultState();
    if (firebaseReady && !TEST_MODE) {
      unsub = onSnapshot(doc(db, "checklists", k), (snap) => {
        if (snap.exists()) { state[k] = { ...defaultState(), ...snap.data() }; render(); }
      });
    }
    render();
  }

  /* ============ 3D ORGANIC HEART (Three.js) ============ */
  const heartCanvas = document.getElementById("heartCanvas");
  const hRenderer = new THREE.WebGLRenderer({
    canvas: heartCanvas, alpha: true, antialias: true
  });
  hRenderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  hRenderer.outputColorSpace = THREE.SRGBColorSpace;
  hRenderer.toneMapping = THREE.ACESFilmicToneMapping;
  hRenderer.toneMappingExposure = 1.05;

  const hScene = new THREE.Scene();
  const hCam = new THREE.PerspectiveCamera(38, 230/190, 0.1, 100);
  hCam.position.set(0, 0.18, 9.0);
  hCam.lookAt(0, 0.35, 0);

  hScene.add(new THREE.HemisphereLight(0xffeee9, 0x3b1420, 1.5));

  const keyLight = new THREE.DirectionalLight(0xffeee9, 2.5);
  keyLight.position.set(4, 5, 7);
  hScene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0xffa8b9, 1.15);
  fillLight.position.set(-5, 1, 4);
  hScene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xff6f8f, 1.25);
  rimLight.position.set(-4, 3, -6);
  hScene.add(rimLight);

  const heartGlow = new THREE.PointLight(0xff3158, 16, 18);
  heartGlow.position.set(0, -1.4, 4);
  hScene.add(heartGlow);

  /* ---------- tissue texture ---------- */
  function muscleTexture() {
    const c = document.createElement("canvas");
    c.width = c.height = 1024;
    const g = c.getContext("2d");

    g.fillStyle = "#a83f45";
    g.fillRect(0, 0, 1024, 1024);

    // Fine mottling rather than obvious circular spots.
    for (let i = 0; i < 900; i++) {
      const x = Math.random() * 1024;
      const y = Math.random() * 1024;
      const r = 2 + Math.random() * 16;
      const alpha = 0.025 + Math.random() * 0.075;
      const colors = ["#e39a91", "#c45d5d", "#7f2936", "#efb3a8", "#92353e"];
      g.globalAlpha = alpha;
      g.fillStyle = colors[(Math.random() * colors.length) | 0];
      g.beginPath();
      g.arc(x, y, r, 0, Math.PI * 2);
      g.fill();
    }

    // Subtle directional muscle fibers.
    g.globalAlpha = 0.075;
    g.strokeStyle = "#5f202c";
    g.lineWidth = 2;
    for (let i = -30; i < 1100; i += 13) {
      g.beginPath();
      g.moveTo(i, 1024);
      g.bezierCurveTo(i + 90, 700, i - 70, 360, i + 50, 0);
      g.stroke();
    }

    g.globalAlpha = 1;
    return new THREE.CanvasTexture(c);
  }

  const muscleMap = muscleTexture();
  muscleMap.wrapS = THREE.RepeatWrapping;
  muscleMap.wrapT = THREE.RepeatWrapping;
  muscleMap.repeat.set(1.5, 1.2);

  const muscleMat = new THREE.MeshPhysicalMaterial({
    color: 0xa94349,
    map: muscleMap,
    roughness: 0.48,
    metalness: 0,
    clearcoat: 0.28,
    clearcoatRoughness: 0.34,
    sheen: 0.18,
    sheenColor: new THREE.Color(0x6e1728)
  });

  const atrialMat = new THREE.MeshPhysicalMaterial({
    color: 0xb85457,
    map: muscleMap,
    roughness: 0.5,
    clearcoat: 0.25,
    sheen: 0.15
  });

  const arteryMat = new THREE.MeshPhysicalMaterial({
    color: 0x8f202c,
    roughness: 0.25,
    clearcoat: 0.55,
    clearcoatRoughness: 0.2
  });

  const veinMat = new THREE.MeshPhysicalMaterial({
    color: 0x4f6f9f,
    roughness: 0.3,
    clearcoat: 0.5,
    clearcoatRoughness: 0.22
  });

  const coronaryArteryMat = new THREE.MeshPhysicalMaterial({
    color: 0xc7353d,
    roughness: 0.27,
    clearcoat: 0.5
  });

  const coronaryVeinMat = new THREE.MeshPhysicalMaterial({
    color: 0x526ba5,
    roughness: 0.3,
    clearcoat: 0.45
  });

  const darkRedMat = new THREE.MeshPhysicalMaterial({
    color: 0x54121e,
    roughness: 0.36,
    clearcoat: 0.25
  });

  /* ---------- organic ventricular body ----------
     This is one continuous mesh.  Its radius changes with height and
     angle, producing an asymmetric anatomical silhouette instead of
     several spheres sitting on top of one another.
  */
  function makeHeartBodyGeometry() {
    const rings = 54;
    const around = 96;
    const positions = [];
    const normals = [];
    const uvs = [];
    const indices = [];

    for (let j = 0; j <= rings; j++) {
      const v = j / rings;
      const y = 2.05 - v * 4.65;

      // Broad superior heart, then taper aggressively toward the apex.
      const p = v;
      const baseWidth =
        1.16 * Math.sin(Math.PI * Math.pow(Math.min(p * 1.08, 1), 0.78)) +
        0.08;

      for (let i = 0; i < around; i++) {
        const a = (i / around) * Math.PI * 2;

        // Anterior view: left ventricle is deliberately larger/thicker.
        const left = Math.max(0, -Math.sin(a));
        const right = Math.max(0, Math.sin(a));

        let rx = baseWidth * (1.0 + 0.16 * left - 0.06 * right);
        let rz = rx * (0.72 + 0.12 * Math.cos(a));

        // Flatten posterior surface slightly.
        if (Math.sin(a) < 0) rz *= 1.05;

        // Natural interventricular indentation.
        const septum = Math.exp(-Math.pow((a - Math.PI * 1.5) / 0.24, 2));
        rx *= 1 - 0.10 * septum;

        // Distinct but smooth LV wall / apex asymmetry.
        const apex = Math.pow(v, 3.0);
        rx *= 1 - 0.30 * apex;
        rz *= 1 - 0.23 * apex;

        // Coronary-sulcus style shallow deformation.
        const groove = Math.exp(-Math.pow((a - Math.PI * 1.55) / 0.18, 2));
        const front = Math.max(0, Math.cos(a));
        const surfaceDip = 1 - 0.045 * groove * (0.25 + 0.75 * v);

        rx *= surfaceDip;
        rz *= surfaceDip;

        // Soft organic irregularity, deterministic from angle/ring.
        const wobble =
          1 +
          0.018 * Math.sin(a * 5 + v * 8) +
          0.012 * Math.sin(a * 11 - v * 13);

        rx *= wobble;
        rz *= wobble;

        const x = Math.cos(a) * rx;
        const z = Math.sin(a) * rz;

        positions.push(x, y, z);
        uvs.push(i / around, v);
      }
    }

    for (let j = 0; j < rings; j++) {
      for (let i = 0; i < around; i++) {
        const a = j * around + i;
        const b = j * around + ((i + 1) % around);
        const c = (j + 1) * around + ((i + 1) % around);
        const d = (j + 1) * around + i;
        indices.push(a, b, d, b, c, d);

    geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();

  /* ---------- physiological-looking beat ----------

  let hBpm = 64, hBpmTarget = 64;

  function gaussian(x, center, width) {
    let d = (x - center) / width;

    // Handle the circular phase boundary.
    if (d > 2) d -= 1 / width;
    if (d < -2) d += 1 / width;

    return Math.exp(-d * d);

  function animateHeart(t) {

    // Compress side-to-side while thickening front/back.

    const depthExpansion = 1 + contraction * 0.060;
    const longitudinalCompression = 1 - contraction * 0.035;

    ventricleGroup.scale.set(
      sideCompression,
      longitudinalCompression,
      depthExpansion
    );

    // Apex moves upward very slightly during systole.

      -contraction * 0.055 + relaxation * 0.008;

    // Small torsional movement characteristic of the ventricular mass.

    ventricleGroup.rotation.y = contraction * 0.025;

    // Great vessels move much less than the ventricles.

      1 - contraction * 0.018,
      1 - contraction * 0.010,
      1 + contraction * 0.015
    );

    atria.scale.set(
      1.22 + atrialPulse,
      0.72 - atrialPulse * 0.45,
      0.78 + atrialPulse
    );

      0.55 * appendagePulse,
      0.34 * appendagePulse,
      0.42 * appendagePulse
    );
    rightAppendage.scale.set(
      0.46 * appendagePulse,
      0.31 * appendagePulse,
      0.40 * appendagePulse
    );

      happyBounce -= 0.045;

    heartGroup.position.y =
      -0.05 +
      Math.sin(t * 1.1) * 0.035 +
      bounce * 0.20;

    heartGroup.scale.setScalar(
      0.68 * (1 + bounce * 0.08)
    );

    halo.scale.set(5.0 * haloPulse, 5.0 * haloPulse, 1);
    halo.material.opacity = 0.60 + contraction * 0.28;

      0.72,
      0.60 + contraction * 0.08
    );

      paintMat(atrialMat, { color: 0xffc4d8, emissive: 0xff7fa5, ei: .30, metal: .1, rough: .08, cc: 1 });
    } else if (id === "galaxy") {
      if (!galaxyTex) galaxyTex = makeGalaxyTex();
      paintMat(muscleMat, { color: 0xffffff, map: galaxyTex, emap: galaxyTex, emissive: 0xffffff, ei: .75, metal: 0, rough: .4, cc: .6 });
      paintMat(atrialMat, { color: 0xcfb8ff, map: galaxyTex, emap: galaxyTex, emissive: 0xb9a0ff, ei: .6, metal: 0, rough: .4, cc: .6 });
    }
  }

    /* ---------- هاله‌ها (نسخه‌ی پررنگ) ---------- */
  const AURAS = {
    aura_gold: { rgb: [255, 196, 50], hex: 0xffc432 },
    aura_blue: { rgb: [70, 170, 255], hex: 0x46aaff }
  };
  const auraTex = {};
  function auraTexture(r, g, b) {
    const c = document.createElement("canvas"); c.width = c.height = 256;
    const x = c.getContext("2d");
    const gr = x.createRadialGradient(128, 128, 0, 128, 128, 128);
    gr.addColorStop(0,   `rgba(${r},${g},${b},.35)`);
    gr.addColorStop(.35, `rgba(${r},${g},${b},.80)`);
    gr.addColorStop(.60, `rgba(${r},${g},${b},.35)`);
    gr.addColorStop(1,   `rgba(${r},${g},${b},0)`);
    x.fillStyle = gr; x.fillRect(0, 0, 256, 256);
    return new THREE.CanvasTexture(c);
  }
  const auraGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  auraGlow.scale.set(6.2, 6.2, 1); auraGlow.position.set(0, .45, -1.0); auraGlow.visible = false;
  const auraRing = new THREE.Mesh(
    new THREE.RingGeometry(1.7, 1.8, 96),
    new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide })
  );
  auraRing.position.set(0, .45, -.8); auraRing.visible = false;
  hScene.add(auraGlow, auraRing);

  const LIGHT_ORIG = { glow: 0xff3158, rim: 0xff6f8f, fill: 0xffa8b9 };
  function setAura(id) {
    const A = AURAS[id];
    auraGlow.visible = auraRing.visible = !!A;
    if (A) {
      if (!auraTex[id]) auraTex[id] = auraTexture(...A.rgb);
      auraGlow.material.map = auraTex[id]; auraGlow.material.needsUpdate = true;
      auraRing.material.color.setHex(A.hex);
      heartGlow.color.setHex(A.hex); rimLight.color.setHex(A.hex); fillLight.color.setHex(A.hex);
    } else {
      heartGlow.color.setHex(LIGHT_ORIG.glow); rimLight.color.setHex(LIGHT_ORIG.rim); fillLight.color.setHex(LIGHT_ORIG.fill);
    }
    lifeParticles.forEach(p => p.material.color.setHex(A ? A.hex : 0xff9caf));
  }

  /* --- تاج --- */
  const goldMat = new THREE.MeshPhysicalMaterial({ color: 0xffc933, metalness: .5, roughness: .25, emissive: 0x8a5a00, emissiveIntensity: .6, clearcoat: 1, side: THREE.DoubleSide });
  const gemMat = new THREE.MeshPhysicalMaterial({ color: 0xff2d55, emissive: 0xaa0020, emissiveIntensity: .8, roughness: .1, clearcoat: 1 });
  const crown = new THREE.Group();
  crown.add(new THREE.Mesh(new THREE.CylinderGeometry(.62, .55, .28, 32, 1, true), goldMat));
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    const spike = new THREE.Mesh(new THREE.ConeGeometry(.13, .42, 12), goldMat);
    spike.position.set(Math.cos(a) * .58, .34, Math.sin(a) * .58);
    const gem = new THREE.Mesh(new THREE.SphereGeometry(.07, 12, 12), gemMat);
    gem.position.set(Math.cos(a) * .58, .58, Math.sin(a) * .58);
    crown.add(spike, gem);
  }
  crown.position.set(.6, 4.45, -.12); crown.rotation.z = -.1; crown.visible = false;

  /* --- هاله فرشته --- */
  const haloRing = new THREE.Mesh(new THREE.TorusGeometry(.55, .05, 12, 48), new THREE.MeshBasicMaterial({ color: 0xffe27a }));
  haloRing.position.set(.6, 4.85, -.12); haloRing.rotation.x = Math.PI / 2 + .15; haloRing.visible = false;

  /* --- بال‌ها --- */
  const featherMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, emissive: 0xffe9f0, emissiveIntensity: .25, roughness: .5 });
  function makeWing(side) {
    const w = new THREE.Group();
    for (let i = 0; i < 5; i++) {
      const L = 1.6 - i * .16;
      const pivot = new THREE.Group();
      pivot.rotation.z = side * (.7 - i * .3);
      const f = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 10), featherMat);
      f.scale.set(L * .5, .09, .28);
      f.position.set(side * L * .5, 0, -i * .02);
      pivot.add(f); w.add(pivot);
    }
    w.position.set(side * .95, 1.2, -.5);
    return w;
  }
  const wings = new THREE.Group();
  const wingL = makeWing(-1), wingR = makeWing(1);
  wings.add(wingL, wingR); wings.visible = false;

  /* --- قلب‌های چرخان --- */
  const orbitGroup = new THREE.Group();
  const orbitTex = emojiTexture("💗");
  const orbitSprites = [];
  for (let i = 0; i < 6; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: orbitTex, transparent: true }));
    sp.scale.setScalar(.55);
    orbitGroup.add(sp); orbitSprites.push(sp);
  }
  orbitGroup.visible = false;

  heartGroup.add(crown, haloRing, wings, orbitGroup);

  function applyCosmetics() {
    const e = profile.equipped || {};
    setSkin(e.skin);
    crown.visible = e.head === "crown";
    haloRing.visible = e.head === "halo";
    wings.visible = e.back === "wings";
    orbitGroup.visible = e.orbit === "orbit";
    setAura(e.aura);
  }

  // انیمیشن آیتم‌ها (جدا از حلقه‌ی اصلی)
  function cosmeticsLoop(ms) {
    const t = ms / 1000;
    const camZ = (crown.visible || haloRing.visible) ? 10.4 : (wings.visible ? 9.7 : 9.0);
    hCam.position.z += (camZ - hCam.position.z) * .06;
    if (crown.visible) crown.position.y = 4.45 + Math.sin(t * 1.6) * .03;
    if (haloRing.visible) haloRing.position.y = 4.85 + Math.sin(t * 1.6) * .05;
    if (wings.visible) { const f = Math.sin(t * 3) * .12; wingL.rotation.z = -f; wingR.rotation.z = f; }
    if (orbitGroup.visible) {
      orbitSprites.forEach((sp, i) => {
        const a = t * .9 + i * Math.PI / 3;
        sp.position.set(Math.cos(a) * 2.4, 1 + Math.sin(t * 1.3 + i) * .25, Math.sin(a) * 1.2);
      });
    }
        if (auraGlow.visible) {
      const k = .5 + .5 * Math.sin(t * 2);
      auraGlow.material.opacity = .75 + .25 * k;
      auraGlow.scale.setScalar(6.2 + .5 * k);
      const w = (t * .6) % 1;               // موج حلقه که از قلب پخش می‌شه
      auraRing.scale.setScalar(1 + w * .55);
      auraRing.material.opacity = .7 * (1 - w);
    }
    requestAnimationFrame(cosmeticsLoop);
  }
  requestAnimationFrame(cosmeticsLoop);

  /* ---------- همگام‌سازی پروفایل با فایربیس ---------- */
  function mergeProfile(r) {
    profile.awarded = { ...(r.awarded || {}), ...profile.awarded };
    const union = (a, b) => [...new Set([...(a || []), ...(b || [])])];
    profile.owned = union(profile.owned, r.owned);
    profile.unlocked = union(profile.unlocked, r.unlocked);
    profile.seen = union(profile.seen, r.seen);
    if (r.equipped) profile.equipped = r.equipped;
  }
  if (firebaseReady) {
    onSnapshot(doc(db, "checklists", "_profile"), snap => {
      if (snap.metadata.hasPendingWrites) return;
      if (!snap.exists()) { if (Object.keys(profile.awarded).length) saveProfile(); return; }
      const r = snap.data();
      mergeProfile(r);
      checkLetters();
      try { localStorage.setItem(PROFILE_LS, JSON.stringify(profile)); } catch (e) {}
      applyCosmetics(); renderEconomyUI(); refreshModal();
      const n = o => Object.keys(o || {}).length;
      if (n(profile.awarded) > n(r.awarded) || profile.owned.length > (r.owned || []).length ||
          profile.unlocked.length > (r.unlocked || []).length || profile.seen.length > (r.seen || []).length) saveProfile();
    }, err => console.error("profile listen error:", err));
  }


    if (TEST_MODE) {
    const tb = mk("button", "eco-btn", "🧪 +30 day streak");
    tb.type = "button"; tb.style.background = "#5a4452";
    tb.addEventListener("click", () => {
      const d = new Date(); d.setHours(0, 0, 0, 0);
      for (let i = 0; i < 30; i++) { profile.awarded[dateKey(d) + ":all"] = 0; d.setDate(d.getDate() - 1); }
      checkLetters(); saveProfile(); renderEconomyUI(); refreshModal();
    });
    const rb = mk("button", "eco-btn", "🧪 Reset test");
    rb.type = "button"; rb.style.background = "#5a4452";
    rb.addEventListener("click", () => { localStorage.removeItem(PROFILE_LS); location.reload(); });
    ecoBar.append(tb, rb);
  }
  applyCosmetics();
  renderEconomyUI();
  load();

</script>
</body>
</html>
