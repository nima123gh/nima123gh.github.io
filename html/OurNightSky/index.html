<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>آسمون چشمات</title>
  <meta name="description" content="خاطرات فراموش نشدنیه دوتا عاشق" />
  <meta name="theme-color" content="#05060f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />


  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Decorative, ambient background: twinkling stars + drifting particles -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div id="moon-glow" aria-hidden="true"></div>
  <div id="vignette" aria-hidden="true"></div>

  <div id="app">

    <!-- The night sky itself. Click any empty space to plant a memory. -->
    <div id="sky-viewport" role="application" aria-label="برای به جا گذاشتن یک خاطره، روی هر جایی از صفحه کلیک کنید">
      <div id="sky-world"></div>
    </div>

    <!-- Top toolbar -->
    <header id="toolbar" class="glass">
      <div class="toolbar__brand">
        <span class="toolbar__title">آسمون چشمات</span>
        <span id="star-counter" class="toolbar__counter">⭐ 0 خاطرات</span>
      </div>

      <div class="toolbar__actions">
        <button type="button" id="search-toggle" class="icon-btn" aria-expanded="false" aria-label="Search memories" title="Search">
          <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 1 0 4.66 13.39l5.23 5.22 1.41-1.41-5.22-5.23A7.5 7.5 0 0 0 10.5 3Zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11Z" fill="currentColor"/></svg>
        </button>

        <button type="button" id="timeline-toggle" class="icon-btn" aria-expanded="false" aria-label="Open memories timeline" title="Memories timeline">
          <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M4 4h16v2H4V4Zm3 5h13v2H7V9Zm-3 5h16v2H4v-2Zm3 5h13v2H7v-2Z" fill="currentColor"/></svg>
        </button>

        <button type="button" id="surprise-btn" class="pill-btn" title="Open a random memory">✨ <span>انتخاب تصادفی</span></button>

        <div class="more-wrap">
          <button type="button" id="more-toggle" class="icon-btn" aria-expanded="false" aria-haspopup="true" aria-label="More options" title="More">
            <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg>
          </button>

          <div id="more-menu" class="more-menu glass" role="menu">
            <button type="button" id="music-toggle" class="more-menu__item" role="menuitem" aria-pressed="false">
              <span class="more-menu__icon" aria-hidden="true">🔈</span><span>موسیقی</span>
            </button>
            <button type="button" id="theme-toggle" class="more-menu__item" role="menuitem" aria-pressed="false">
              <span class="more-menu__icon" aria-hidden="true">🌙</span><span>آسمون غروب</span>
            </button>
            <button type="button" id="export-btn" class="more-menu__item" role="menuitem">
              <span class="more-menu__icon" aria-hidden="true">⬆</span><span>استخراج خاطره</span>
            </button>
            <button type="button" id="import-btn" class="more-menu__item" role="menuitem">
              <span class="more-menu__icon" aria-hidden="true">⬇</span><span>افزودن خاطره</span>
            </button>
            <input type="file" id="import-file" accept="application/json" hidden />
          </div>
        </div>
      </div>
    </header>

    <!-- Search panel -->
    <div id="search-panel" class="search-panel glass">
      <label for="search-input" class="visually-hidden">جستجو خاطره</label>
      <input type="search" id="search-input" placeholder="قلب من، اسم خاطره رو بنویس تا برات بیاد" autocomplete="off" />
      <div id="search-results" class="search-results"></div>
    </div>

    <!-- Timeline / Memories side panel -->
    <aside id="timeline-panel" class="timeline-panel glass" aria-label="باز کردن">
      <div class="timeline-panel__header">
        <h2>خاطرات</h2>
        <button type="button" id="timeline-close" class="icon-btn" aria-label="بستن">✕</button>
      </div>
      <div id="timeline-list" class="timeline-list"></div>
    </aside>

    <!-- Toast notifications -->
    <div id="toast-container" aria-live="polite"></div>

    <!-- Empty-sky hint -->
    <p id="empty-hint" class="empty-hint">برای به جا گذاشتن یک خاطره، روی هر جایی از صفحه کلیک کنید</p>

    <!-- ============================= MODALS ============================= -->
    <div id="modal-root" class="modal-root">
      <div class="modal-backdrop"></div>

      <!-- Create -->
      <div id="create-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="create-modal-title">
        <div class="modal__card modal__card--create">
          <div class="modal__glow" aria-hidden="true"></div>
          <h2 id="create-modal-title" class="modal__eyebrow">خاطره جدید</h2>
          <form id="create-form">
            <label for="create-title">عنوان</label>
            <input type="text" id="create-title" name="title" maxlength="60" placeholder="یه اسم برای امشب یا یک حس از ته قلبت" required />

            <label for="create-message">خاطرات</label>
            <textarea id="create-message" name="message" maxlength="600" rows="5" placeholder="میتونی بیشتر برام تعریف کنی فرشته کوچولو؟" required></textarea>

            <label for="create-image">تصویر (اختیاری)</label>
            <input type="file" id="create-image" name="image" accept="image/*" />
            <div id="create-image-preview-wrap" class="image-preview-wrap" hidden>
              <img id="create-image-preview" class="image-preview" alt="پیش‌نمایش تصویر" />
              <button type="button" id="create-image-remove" class="image-preview__remove" aria-label="حذف تصویر">✕</button>
            </div>

            <div class="modal__actions">
              <button type="button" class="btn btn--ghost" data-modal-close>لغو</button>
              <button type="submit" class="btn btn--primary">قرار دادن ستاره</button>
            </div>
          </form>
        </div>
      </div>

      <!-- View -->
      <div id="view-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="view-title">
        <div class="modal__card modal__card--view">
          <div class="modal__glow" aria-hidden="true"></div>
          <div class="modal__eyebrow-row">
            <span class="modal__eyebrow">⭐ خاطره</span>
            <button type="button" id="view-copy-btn" class="icon-btn icon-btn--small" aria-label="کپی متن خاطره" title="کپی متن خاطره">
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1Zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm0 16H8V7h11v14Z" fill="currentColor"/></svg>
            </button>
          </div>
          <h2 id="view-title"></h2>
          <p id="view-date" class="modal__date"></p>
          <div id="view-image-wrap" class="modal__image-wrap" hidden>
            <img id="view-image" class="modal__image" alt="" />
          </div>
          <p id="view-message" class="modal__message"></p>
          <div class="modal__actions modal__actions--spread">
            <button type="button" id="view-favorite-btn" class="btn btn--ghost" aria-pressed="false">☆ مورد علاقه ها</button>
            <div class="modal__actions">
              <button type="button" id="view-edit-btn" class="btn btn--ghost">ویرایش</button>
              <button type="button" id="view-delete-btn" class="btn btn--danger">پاک کردن</button>
              <button type="button" class="btn btn--primary" data-modal-close>بستن</button>
            </div>
          </div>

          <div class="modal__replies">
            <h3 class="modal__replies-title">ریپلای ها</h3>
            <div id="view-replies-list" class="reply-thread"></div>
            <form id="reply-form" class="reply-form reply-form--main">
              <textarea id="reply-input" rows="2" maxlength="400" placeholder="ریپلای بزن غورباقم" required></textarea>
              <div class="reply-form__actions">
                <button type="submit" class="btn btn--primary btn--small">ارسال ریپلای</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Edit -->
      <div id="edit-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
        <div class="modal__card modal__card--create">
          <div class="modal__glow" aria-hidden="true"></div>
          <h2 id="edit-modal-title" class="modal__eyebrow">ویرایش</h2>
          <form id="edit-form">
            <label for="edit-title">عنوان</label>
            <input type="text" id="edit-title" name="title" maxlength="60" required />

            <label for="edit-message">خاطره</label>
            <textarea id="edit-message" name="message" maxlength="600" rows="5" required></textarea>

            <label for="edit-image">تصویر (اختیاری)</label>
            <input type="file" id="edit-image" name="image" accept="image/*" />
            <div id="edit-image-preview-wrap" class="image-preview-wrap" hidden>
              <img id="edit-image-preview" class="image-preview" alt="پیش‌نمایش تصویر" />
              <button type="button" id="edit-image-remove" class="image-preview__remove" aria-label="حذف تصویر">✕</button>
            </div>

            <div class="modal__actions">
              <button type="button" class="btn btn--ghost" data-modal-close>لغو</button>
              <button type="submit" class="btn btn--primary">ذخیره تغییرات</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Delete confirm -->
      <div id="delete-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
        <div class="modal__card modal__card--confirm">
          <h2 id="delete-modal-title">مطمعنی میخوای حذفش کنی پرنسسم؟</h2>
          <p>دیگه آخه نمیشه برگردوندش، مگه اینکه  تو حافظت ذخیره کرده باشی خاطره هارو. برای همیشه از آسمون پاک میشه دخترم مراقب باش.</p>
          <div class="modal__actions">
            <button type="button" class="btn btn--ghost" data-modal-close>نگه داشتن</button>
            <button type="button" id="confirm-delete-btn" class="btn btn--danger">پاک کردن</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
